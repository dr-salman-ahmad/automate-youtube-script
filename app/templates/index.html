<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap");
    </style>
    <title>Youtube Transcription</title>
  </head>
  <body>
    <h1 class="text-center text-4xl font-bold mt-20" style="font-family: 'Open Sans', sans-serif">
      Transcribe YouTube Videos
    </h1>
    <div class="flex items-center justify-center mt-10">
      <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
        <img src="./../static/images/youtube-svgrepo-com.svg" alt="YouTube Logo" class="h-15 mr-3" />
      </a>
      <div class="min-w-[500px]">
        <input
          id="youtube-link"
          type="text"
          placeholder="Enter YouTube link"
          class="w-full px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-opacity-50"
        />
      </div>
      <button
        id="transcribe-button"
        class="ml-3 px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-700 transition duration-300"
        onclick="transcribeVideo()"
      >
        Transcribe
      </button>
    </div>
    <div id="transcription-container" class="mt-10 mx-40" hidden>
      <textarea
        id="transcription-text"
        class="w-full h-[800px] p-4 rounded-lg border border-gray-300 shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        style="font-family: 'Open Sans', sans-serif"
      ></textarea>
      <div class="flex justify-center mt-5 mb-10">
        <button
          id="generate-audio"
          class="bg-blue-500 text-white text-2xl px-4 py-2 rounded-md hover:bg-blue-700 transition duration-300 mt-5 w-[800px]"
          style="font-family: 'Open Sans', sans-serif"
        >
          Generate Audio
        </button>
      </div>
    </div>
    <script>
      let isTranscribing = false;
      async function transcribeVideo() {
        if (isTranscribing) return;
        isTranscribing = true;
        document.getElementById("transcribe-button").disabled = true;
        const url = document.getElementById("youtube-link").value;
        try {
          const response = await fetch("/transcribe", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ url }),
          });
          const data = await response.json();
          if (data.text) {
            document.getElementById("transcription-text").value = data.text;
            document.getElementById("transcription-container").hidden = false;
          }
        } catch (error) {
          console.error("Error transcribing video:", error);
        } finally {
          isTranscribing = false;
          document.getElementById("transcribe-button").disabled = false;
        }
      }
    </script>
  </body>
</html>
